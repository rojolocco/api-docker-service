services:
  api-vps:
    container_name: api-vps
    image: ghcr.io/rojolocco/api-docker-service:0.2.0
    env_file:
      - .env
    volumes:
      - api_data:/app/data
    networks:
      - traefik_network
    expose:
      - 8000
    restart: unless-stopped

volumes:
  api_data:
    driver: local

networks:
  traefik_network:
    external: true
